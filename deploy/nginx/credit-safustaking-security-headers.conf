# credit.safustaking.com — security headers snippet, own file deliberately
# (do NOT reuse the shared safustaking-security-headers.conf — the CSP differs,
# and add_header is all-or-nothing per block per the T3 eng review's own warning).
#
# CSP notes (locked 2026-09-15):
# - script-src has NO 'unsafe-inline' -- the app is a pure static Vite/React
#   bundle, zero inline <script> tags, zero external script hosts (CSO-verified).
# - style-src NEEDS 'unsafe-inline' -- the built React code uses inline
#   style={{...}} props throughout every panel, which CSP's style-src
#   directive governs (unlike script-src). This is a deliberate, lower-risk
#   exception (CSS injection, not code execution) discovered when the actual
#   5g code was read at deploy time -- the wallet-connect eng review's "no
#   unsafe-inline" language was about WalletConnect's own modal CSS
#   requirement (dropped along with WalletConnect itself), not a claim that
#   our own inline styles wouldn't need it. Removing this would visibly break
#   the live layout.
# - No relay/verify/pulse/web3modal/reown domains anywhere -- WalletConnect
#   was never wired in (Phantom/Solflare/Backpack extension-only).
# - No frame-src needed at all -- zero iframes anywhere in this app.
add_header X-Frame-Options           "DENY"                              always;
add_header X-Content-Type-Options    "nosniff"                           always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.devnet.solana.com wss://api.devnet.solana.com; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
