# credit.safustaking.com -- SAFU Credit (Stocklana) frontend
# Own nginx server block, own CSP -- deliberately never a path under the live
# T3 safustaking.com site (locked decision, memory/projects/safu/stocklana.md).
# Static SPA only -- no API proxy, no backend on this host. Every RPC call
# goes client-side, straight from the browser to Solana devnet.
#
# Deploy note: this file is written in its FINAL form (both server blocks)
# because certbot's --nginx authenticator can obtain the cert against a file
# that already declares `listen 443 ssl` with not-yet-existent cert paths --
# it uses a temporary in-memory config for the HTTP-01 challenge, it does not
# require this file to pass `nginx -t` first. If that assumption is wrong in
# practice, fall back to a two-phase deploy: comment out the 443 block, get
# the cert with `certbot certonly --nginx -d credit.safustaking.com`, then
# uncomment and reload.

server {
    listen 80;
    server_name credit.safustaking.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name credit.safustaking.com;

    ssl_certificate     /etc/letsencrypt/live/credit.safustaking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/credit.safustaking.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/credit-safustaking-security-headers.conf;

    root  /var/www/credit-safustaking;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/credit-safustaking-security-headers.conf;
    }

    location ~* \.(css|js|ico|svg|woff2?|png)$ {
        add_header Cache-Control "public, must-revalidate";
        include /etc/nginx/snippets/credit-safustaking-security-headers.conf;
    }
}
