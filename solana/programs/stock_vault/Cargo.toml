[package]
name = "stock_vault"
version = "0.1.0"
description = "SAFU Credit: USDC loans against tokenized stocks, with wrongful-liquidation guards"
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stock_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token_2022", "token_2022_extensions"] }
safu-core = { path = "../../../crates/safu-core" }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
spl-token-2022-interface = "=2.1.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
