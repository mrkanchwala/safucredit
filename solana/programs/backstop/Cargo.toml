[package]
name = "backstop"
version = "0.1.0"
description = "SAFU Credit: backer capital, wrongful-liquidation payouts, bad-debt cover"
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "backstop"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["token", "token_2022"] }
safu-core = { path = "../../../crates/safu-core" }
# Read-only: gives Anchor the vault's account types, so `Account<T>` enforces that a
# LiquidationRecord or Market really is owned by the vault program.
stock_vault = { path = "../stock_vault", features = ["no-entrypoint"] }
# Both already resolved in the vetted lockfile at these versions (transitive via anchor-lang).
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.4.0"
spl-token-2022-interface = "=2.1.0"
spl-token-interface = "=2.0.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
