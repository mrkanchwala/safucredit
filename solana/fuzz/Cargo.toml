[package]
name = "stock-vault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
stock_vault = { path = "../programs/stock_vault" }

[[bin]]
name = "requote_roundtrip"
path = "fuzz_targets/requote_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]
